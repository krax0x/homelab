services:

  grafana:
    image: grafana/grafana
    container_name: grafana
    user: "0"
    volumes:
      - /data/config/grafana/grafana_data:/var/lib/grafana
      - /data/config/grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - /data/config/grafana/config.monitoring
    ports:
      - 3000:3000
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - 3100:3100
    volumes:
      - /data/config/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    user: "0"
    volumes:
      - /data/config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - monitoring
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    user: "0"
    volumes:
      - /data/config/prometheus/:/etc/prometheus/
      - /data/config/prometheus/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    links:
      - cadvisor:cadvisor
      - alertmanager:alertmanager
    ports:
      - 9090:9090
    networks:
      - monitoring
    restart: always

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    user: "0"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave
    command: 
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - 9100:9100
    networks:
      - monitoring
    restart: always
#### This will run the instance on each node on docker swarm install ####
#### If it's not docker swarm instance, it will be ignored.          ####
    deploy:
      mode: global

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    ports:
      - 9093:9093
    volumes:
      - /data/config/alertmanager/:/etc/alertmanager/
    networks:
      - monitoring
    restart: always
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
#    deploy:
#      placement:
#        constraints:
#          - node.hostname == ${HOSTNAME}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    user: "0"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 8070:8080
    networks:
      - monitoring
    restart: always
#### This will run the instance on each node on docker swarm install ####
#### If it's not docker swarm instance, it will be ignored.          ####   
    deploy:
      mode: global

  go-tapo-exporter:
    image: tess1o/go-tapo-exporter:latest-amd64
    container_name: go_tapo_exporter
    volumes:
      - /data/config/tapo/config.json:/app/config.json:ro
    ports:
      - 8086:8086
    env_file:
      - /data/config/tapo/.env
    networks:
      - monitoring
    restart: always

networks:
  monitoring:
    driver: bridge
